<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raízes do Nordeste</title>
    <style>
        :root {
            --brand-color: #D35400; --bg-color: #FAFAFA; --surface-color: #FFFFFF;
            --text-main: #111111; --text-muted: #666666; --border-color: #EAEAEA;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }

        .navbar { background-color: var(--surface-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--brand-color); }
        .login-btn { background-color: transparent; color: var(--brand-color); border: 1px solid var(--brand-color); padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 500; text-decoration: none; }
        
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&q=80') center/cover; color: white; padding: 4rem 2rem; text-align: center; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.6; }

        .menu-section { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .category-title { margin: 2rem 0 1rem 0; font-size: 1.4rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; color: var(--brand-color); }
        .product-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }

        .product-card { background: var(--surface-color); border: 1px solid var(--border-color); padding: 1.2rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden; }
        .product-info h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
        .product-info p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; max-width: 85%; }
        .price { font-weight: bold; color: var(--text-main); display: block; margin-top: 0.5rem; }
        .add-btn { background-color: var(--brand-color); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }

        /* tags das limitacoes dos pratos */
        .badge-sazonal { display: inline-block; background-color: #FFF3E0; color: var(--brand-color); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.5rem; }
        .badge-regional { display: inline-block; background-color: #E8F5E9; color: #27AE60; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.5rem; }

        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--surface-color); border-top: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); }
        .cart-bar.hidden { display: none; }
        .cart-info { display: flex; flex-direction: column; }
        .cart-total { font-size: 1.2rem; font-weight: bold; color: var(--brand-color); }
        .checkout-btn { background-color: var(--brand-color); color: white; border: none; padding: 0.8rem 1.5rem; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Raízes do Nordeste</div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div id="unitDisplay" style="font-size: 0.85rem; color: #666; font-weight: 500; background: #EEE; padding: 0.4rem 0.8rem; border-radius: 20px;">
                📍 <span id="unitNameSpan">Carregando...</span>
            </div>
            <a href="login.html" class="login-btn" id="navLoginBtn">Entrar</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Tradição, Sabor e Acolhimento</h1>
        <p>O cardápio da sua região feito com ingredientes selecionados e receitas originais.</p>
    </header>

    <main class="menu-section" id="menu-container"></main>

    <aside class="cart-bar hidden" id="cartBar">
        <div class="cart-info">
            <span id="cartCount">0 itens</span>
            <span class="cart-total" id="cartTotal">R$ 0,00</span>
        </div>
        <a href="checkout.html" class="checkout-btn">Finalizar Pedido</a>
    </aside>

    <script>
        const unidadeAtual = localStorage.getItem("unidade_selecionada") || "Recife";
        document.getElementById("unitNameSpan").textContent = unidadeAtual;

        // banco de dados falso com as regras de regiao e epoca
        const cardapio = {
            "Clássicos Nordestinos": [
                { id: 1, nome: "Cuscuz Completo", desc: "Massa de milho no vapor, ovo frito e carne seca.", preco: 18.50, unidades: ["Todas"], sazonal: false },
                { id: 2, nome: "Baião de Dois", desc: "Arroz, feijão de corda, queijo coalho.", preco: 32.00, unidades: ["Todas"], sazonal: false },
                { id: 10, nome: "Escondidinho de Pinhão", desc: "Purê de macaxeira com recheio de carne e pinhão.", preco: 35.00, unidades: ["Curitiba", "Porto Alegre", "Florianópolis"], sazonal: true, tagRegional: "Exclusivo Sul" }
            ],
            "Tapiocas": [
                { id: 4, nome: "Tapioca de Carne de Sol", desc: "Clássica nordestina com requeijão.", preco: 22.00, unidades: ["Todas"], sazonal: false },
                { id: 11, nome: "Tapioca de Pernil Paulista", desc: "Recheio robusto de pernil desfiado com pimentões.", preco: 24.00, unidades: ["São Paulo"], sazonal: false, tagRegional: "Exclusivo SP" },
                { id: 12, nome: "Tapioca de Erva-Mate", desc: "Massa especial esverdeada com recheio de charque.", preco: 23.00, unidades: ["Porto Alegre", "Campo Grande"], sazonal: false, tagRegional: "Regional" }
            ],
            "Especiais de Época": [
                { id: 13, nome: "Canjica (Mungunzá) Doce", desc: "Canjica cremosa com canela e amendoim.", preco: 14.00, unidades: ["Todas"], sazonal: true },
                { id: 14, nome: "Bolo de Milho Verde", desc: "Fatia quente com crosta dourada.", preco: 12.00, unidades: ["Todas"], sazonal: true }
            ]
        };

        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

        function carregarCardapio() {
            const container = document.getElementById("menu-container");
            container.innerHTML = "";
            
            for (const categoria in cardapio) {
                // pega so os produtos da loja atual ou os globais
                const produtosFiltrados = cardapio[categoria].filter(p => p.unidades.includes("Todas") || p.unidades.includes(unidadeAtual));
                
                if (produtosFiltrados.length === 0) continue; // pula se a categoria tiver vazia

                container.innerHTML += `<h2 class="category-title">${categoria}</h2>`;
                let gridHTML = `<div class="product-grid">`;
                
                produtosFiltrados.forEach(produto => {
                    let tags = "";
                    if (produto.sazonal) tags += `<span class="badge-sazonal">Especial Sazonal</span> `;
                    if (produto.tagRegional) tags += `<span class="badge-regional">${produto.tagRegional}</span>`;

                    gridHTML += `
                        <div class="product-card">
                            <div class="product-info">
                                ${tags}
                                <h3>${produto.nome}</h3>
                                <p>${produto.desc}</p>
                                <span class="price">R$ ${produto.preco.toFixed(2).replace('.', ',')}</span>
                            </div>
                            <button class="add-btn" onclick="tentarComprar(${produto.id}, '${produto.nome}', ${produto.preco})">+</button>
                        </div>
                    `;
                });
                gridHTML += `</div>`;
                container.innerHTML += gridHTML;
            }
        }

        function tentarComprar(id, nome, preco) {
            if (!localStorage.getItem("cliente_logado")) {
                window.location.href = "login.html";
                return;
            }
            carrinho.push({ id, nome, preco });
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            const cartBar = document.getElementById("cartBar");
            if (carrinho.length > 0) {
                cartBar.classList.remove("hidden");
                const total = carrinho.reduce((sum, item) => sum + item.preco, 0);
                document.getElementById("cartCount").textContent = `${carrinho.length} item(ns)`;
                document.getElementById("cartTotal").textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
                localStorage.setItem("carrinho", JSON.stringify(carrinho));
                localStorage.setItem("total_carrinho", total);
            } else {
                cartBar.classList.add("hidden");
            }
        }

        window.onload = () => {
            carregarCardapio();
            const cliente = localStorage.getItem("cliente_logado");
            if (cliente) {
                const btn = document.getElementById("navLoginBtn");
                btn.textContent = `Meu Perfil`;
                btn.href = "perfil.html";
                atualizarCarrinho();
            }
        };
    </script>
</body>
</html>
